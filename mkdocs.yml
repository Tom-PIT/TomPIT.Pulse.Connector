site_name: PULSE Integration Documentation
site_description: Technical documentation for integrating customer systems with PULSE.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Prerequisites: getting-started/prerequisites.md
      - Validation: getting-started/validation.md
      - First request: getting-started/first-request.md