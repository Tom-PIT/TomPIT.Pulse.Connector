site_name: PULSE Integration Documentation
site_description: Technical documentation for integrating customer systems with PULSE.

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/pulse-logo.svg
  favicon: assets/favicon.png
  language: en

  features:
   ## - navigation.tabs
   ## - navigation.tabs.sticky
   ## - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

  palette:
    - scheme: pulse
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Getting started:
      - Integration overview: getting-started/index.md
      - Authentication: getting-started/authentication.md
      - First request: getting-started/first-request.md
      - Validation: getting-started/validation.md

  - Integration:
    - Overview: integration/index.md
    - Master data:
        - Overview: integration/master-data/index.md
        - Measure unit: integration/master-data/measure-unit.md
        - Plant: integration/master-data/plant.md
        - Downtime category: integration/master-data/downtime-category.md
        - Material: integration/master-data/material.md
        - Product: integration/master-data/product.md
        - Production line: integration/master-data/production-line.md
        - Equipment: integration/master-data/equipment.md
        - Shift: integration/master-data/shift.md
        - Labour: integration/master-data/labour.md
        - Energy source: integration/master-data/energy-source.md
        - Expense: integration/master-data/expense.md
        - Supplier: integration/master-data/supplier.md
        - Downtime type: integration/master-data/downtime-type.md
        - Downtime cause: integration/master-data/downtime-cause.md
        - Waste type: integration/master-data/waste-type.md
        - Delay: integration/master-data/delay.md
        - Ambient type: integration/master-data/ambient-type.md
         
      - Map your data: integration/index.md
      - Operational data: integration/operational-data.md
      - Measurements: integration/measurements.md
      - Updates and errors: integration/updates-and-errors.md

  - Scenarios:
      - Typical production day: scenarios/typical-operational-day.md

  - Data model:
      - Overview: data-model/index.md
      - Entity relationships: data-model/relationships.md

  - API reference: api/index.md

  - Troubleshooting: troubleshooting.md