site_name: PULSE Integration Documentation
site_description: Technical documentation for integrating customer systems with PULSE.

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/pulse-logo.svg
  favicon: assets/favicon.png
  language: en

  features:
   ## - navigation.tabs
   ## - navigation.tabs.sticky
   ## - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

  palette:
    - scheme: pulse
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Getting started:
